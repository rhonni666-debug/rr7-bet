name: Deploy GitHub Pages

on:
  push:
    branches: [fn-ia-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Install RR7 dependencies
        run: npm install --no-audit --no-fund
      - name: Test RR7
        run: npm run test
      - name: Test RIPCOM SDK
        run: npm run ripcom:sdk:test
      - name: Typecheck RR7
        run: npm run typecheck
      - name: Build RR7
        run: npm run build
      - name: Install RIPCOM provider dependencies
        run: npm --prefix ripcom-provider install --no-audit --no-fund
      - name: Typecheck RIPCOM provider
        run: npm --prefix ripcom-provider run typecheck
      - name: Build RIPCOM provider
        run: npm --prefix ripcom-provider run build
      - name: Publish standalone RIPCOM app inside Pages artifact
        run: |
          mkdir -p dist/ripcom-provider
          cp -R ripcom-provider/dist/. dist/ripcom-provider/
      - name: Install FN-IA host dependencies
        run: npm --prefix fn-ia-host install --no-audit --no-fund
      - name: Typecheck FN-IA host
        run: npm --prefix fn-ia-host run typecheck
      - name: Build FN-IA host
        run: npm --prefix fn-ia-host run build -- --base=/rr7-bet/fn-ia/
      - name: Publish FN-IA inside Pages artifact
        run: |
          mkdir -p dist/fn-ia
          cp -R fn-ia-host/dist/. dist/fn-ia/
      - name: RR7 SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
