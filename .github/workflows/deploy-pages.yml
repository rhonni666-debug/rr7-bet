name: Deploy FN-IA

on:
  push:
    branches: [main]
    paths:
      - "fn-ia-host/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5

      - name: Install FN-IA
        run: npm --prefix fn-ia-host install --no-audit --no-fund

      - name: Typecheck FN-IA
        run: npm --prefix fn-ia-host run typecheck

      - name: Build FN-IA
        run: npm --prefix fn-ia-host run build -- --base=/rr7-bet/

      - name: GitHub Pages SPA fallback
        run: cp fn-ia-host/dist/index.html fn-ia-host/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fn-ia-host/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy FN-IA to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
