name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install RR7 dependencies
        run: npm install --no-audit --no-fund
      - name: Test RR7
        run: npm run test
      - name: Test RIPCOM SDK
        run: npm run ripcom:sdk:test
      - name: Validate RIPCOM integration assets
        run: |
          node --check examples/ripcom-node-operator/server.mjs
          node -e "JSON.parse(require('fs').readFileSync('ripcom-provider/public/provider-manifest.json','utf8')); console.log('RIPCOM provider manifest: OK')"
      - name: Typecheck RR7
        run: npm run typecheck
      - name: Build RR7
        run: npm run build
      - name: Install RIPCOM provider dependencies
        run: npm --prefix ripcom-provider install --no-audit --no-fund
      - name: Typecheck RIPCOM provider
        run: npm --prefix ripcom-provider run typecheck
      - name: Build RIPCOM provider
        run: npm --prefix ripcom-provider run build
